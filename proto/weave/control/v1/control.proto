// ControlService is core's control socket: the one endpoint for the CLI
// (weavectl) and, later, the portal. Access is gated by socket permissions,
// not credentials — if you can open the socket, you are an operator.

syntax = "proto3";

package weave.control.v1;

import "weave/agent/v1/handshake.proto";
import "weave/agent/v1/health.proto";
import "weave/agent/v1/registry.proto";
import "weave/agent/v1/ui.proto";

service ControlService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Modules(ModulesRequest) returns (ModulesResponse);
  // Surfaces returns every module's declared UI surfaces; this is the
  // portal's read path.
  rpc Surfaces(SurfacesRequest) returns (SurfacesResponse);
  rpc Install(InstallRequest) returns (InstallResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  // Reload rereads the installed-modules directory and applies what changed
  // since core last read it: a new module starts, a removed one stops, and one
  // whose manifest version, binary or config changed is replaced. It is the
  // same pass SIGHUP, the directory watch and the periodic rescan run.
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc Logs(LogsRequest) returns (stream LogLine);
}

message StatusRequest {}

message StatusResponse {
  string core_version = 1;
  weave.agent.v1.ProtocolRange protocol = 2;
  string device_id = 3;
  // True when device_id is persistent rather than session-scoped.
  bool enrolled = 4;
  // Seconds since core started.
  uint64 uptime_seconds = 5;
  // Set while core is running degraded (its store cannot be opened, for
  // one); unset while it is whole.
  weave.agent.v1.CoreCondition core = 6;
}

message ModulesRequest {}

message ModuleStatus {
  string id = 1;
  string version = 2;
  uint32 protocol = 3;
  // Lifecycle state, then ": " and the detail when there is one. States:
  // "pending", "starting", "running", "backoff", "start-limited",
  // "unsupported-protocol", "requirements-unmet", "waiting-for-session",
  // "stopped", "invalid".
  string state = 4;
  weave.agent.v1.Health health = 5;
  int32 pid = 6;
  uint32 restarts = 7;
  // The name the module answers to on the host channel.
  string address = 8;
  // When the module entered its state, in Unix milliseconds.
  int64 since_ms = 9;
}

message ModulesResponse {
  repeated ModuleStatus modules = 1;
}

message SurfacesRequest {}

message ModuleSurfaces {
  string module_id = 1;
  repeated weave.agent.v1.Surface surfaces = 2;
}

message SurfacesResponse {
  repeated ModuleSurfaces modules = 1;
}

message InstallRequest {
  string module_id = 1;
  // Version to install; empty means the channel manifest's current.
  string version = 2;
  // Local artifact path (dev builds only); empty fetches per the manifest.
  string local_path = 3;
}

message InstallResponse {
  string installed_version = 1;
}

message RollbackRequest {
  string module_id = 1;
}

message RollbackResponse {
  string rolled_back_to = 1;
}

message ReloadRequest {}

message ReloadResponse {
  // Module ids started by this pass.
  repeated string added = 1;
  // Module ids stopped because they are no longer installed.
  repeated string removed = 2;
  // Module ids restarted on a changed version, binary or config.
  repeated string replaced = 3;
  // Every module directory core cannot run as it stands after this pass,
  // whether or not this pass is the one that found it.
  repeated InvalidModule invalid = 4;
}

message InvalidModule {
  // The module directory's name, which is the module id when the manifest
  // could be read.
  string id = 1;
  string detail = 2;
}

message LogsRequest {
  // Filter to one module; empty streams core and all modules.
  string module_id = 1;
  bool follow = 2;
}

message LogLine {
  string source = 1;
  string line = 2;
  int64 time_ms = 3;
}
