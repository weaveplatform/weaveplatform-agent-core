version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Request/response types are prefixed by concern (StoreGetRequest), not
    # suffix-conventioned per RPC, and Get/Watch deliberately share
    # PolicyDocument: the stream element IS the document, not a wrapper.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - WIRE_JSON
