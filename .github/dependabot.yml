# Every dependency tracks its latest release. Updates arrive daily, grouped
# into one PR per ecosystem, majors included; auto-merge.yml merges each PR
# once the quality gate passes on it, so the gate is the only thing that can
# hold an update back.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      # "chore(deps): …": conventional, and not a releasable change
      prefix: "chore"
      include: "scope"

  # The root module only: test/protocompat/v1 is the protocol-1 fixture and
  # keeps its pins.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    # grpc 1.84.0 carries GO-2026-6443 (server panic on a request with no
    # :authority or Host header) and no 1.84 release fixes it; stay on 1.83.2
    # until a fixed release exists, then drop this and .github/deps-refresh.pins.
    ignore:
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.x"]
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
